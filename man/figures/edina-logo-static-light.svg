<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" role="img" aria-labelledby="edinalTitle edinalDesc">
<title id="edinalTitle">edina</title>
<desc id="edinalDesc">Hexagonal logo for the R package edina. A solid punch card with its top-left corner cut fills the middle of the hex, with the word edina cut out of its lower half. Above the word, the card is punched with a Q-matrix of three attribute rows by nine item columns. Square holes, sized by posterior probability, mark the entries the sampler is sure of: two identity staircases at the left and right and, between them, three items that need more than one attribute. Three entries in the middle row, whether those items also need the second attribute, are orange hanging chads: punched, but still attached by one corner. Entries the sampler rejects are faint dots, never punched.</desc>
